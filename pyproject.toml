[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrashift"
version = "0.1.0"
description = "Land-use change detection in multispectral satellite imagery"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchvision>=0.16",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pillow>=10.0",
]
geo = ["rasterio>=1.3"]
dev = ["pytest>=7.4", "httpx>=0.26"]

[tool.setuptools.packages.find]
include = ["terrashift*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
